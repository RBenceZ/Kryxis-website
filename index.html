<!DOCTYPE html>
<html lang="en" style="--accent-color: #ffffff; --card-bg: rgba(14, 14, 16, 0.45);">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryxi</title>
    <link rel="icon" type="image/png" href="assets/pfp.webp">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #ffffff;
            --card-bg: rgba(15, 15, 15, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --glow-strength: 14px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Background Video & Image */
        #bg-media-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #050505;
        }
        #bg-video, #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }
        /* Subtle Scanlines & Vignette */
        .vignette-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
        }
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            opacity: 0.35;
        }
        /* Click to Enter Overlay */
        #enter-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: rgba(5, 5, 5, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        #enter-screen.hidden-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            letter-spacing: 0.2em;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            animation: pulseGlow 2.2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.45; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        /* Main Glass Card - Világító széllel */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.38);
            box-shadow: 
                0 0 22px rgba(255, 255, 255, 0.16),
                0 0 45px rgba(255, 255, 255, 0.06),
                inset 0 0 14px rgba(255, 255, 255, 0.08),
                0 25px 50px -12px rgba(0, 0, 0, 0.85);
            transition: transform 0.15s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
            transform-style: preserve-3d;
        }
        .profile-card:hover {
            border-color: rgba(255, 255, 255, 0.55);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.24),
                0 0 60px rgba(255, 255, 255, 0.1),
                inset 0 0 18px rgba(255, 255, 255, 0.12),
                0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }
        /* Username Glow */
        .username-glow {
            color: var(--accent-color);
            text-shadow: 0 0 var(--glow-strength) rgba(255, 255, 255, 0.65), 0 0 26px rgba(255, 255, 255, 0.25);
        }
        /* Avatar Ring */
        .avatar-wrapper {
            position: relative;
        }
        .avatar-ring {
            position: absolute;
            inset: -3px;
            border-radius: 9999px;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.05), rgba(255,255,255,0.4));
            z-index: -1;
            animation: spinSlow 8s linear infinite;
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* Social Icon Hover */
        .social-btn {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .social-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px) scale(1.06);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
        }
        /* Custom Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 4px;
            border-radius: 999px;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            cursor: pointer;
            transition: transform 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        /* Particle Canvas */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }
        /* Typing Cursor */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            z-index: 100;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.8rem;
            color: #fff;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Click to Enter Screen -->
    <div id="enter-screen" onclick="enterSite()">
        <span class="enter-text">click to enter...</span>
    </div>

    <!-- Background Video & Image -->
    <div id="bg-media-container">
        <video id="bg-video" autoplay loop muted playsinline preload="auto">
            <source src="assets/background.mp4" type="video/mp4">
        </video>
        <img id="bg-image" class="hidden" alt="Background">
    </div>

    <!-- Overlays & Particle Effect -->
    <div class="vignette-overlay"></div>
    <div class="scanlines"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- Hidden Audio Element (csak kattintás után indul el) -->
    <audio id="bg-audio" loop preload="auto">
        <source src="assets/songg.mp3" type="audio/mpeg">
    </audio>

    <!-- Top-Right Expandable Volume Control -->
    <div id="top-controls" class="fixed top-4 right-4 z-30 flex items-center opacity-0 transition-opacity duration-700">
        <div class="group flex items-center bg-black/50 backdrop-blur-md border border-white/10 p-2 rounded-2xl hover:border-white/25 transition-all duration-300 shadow-lg">
            <!-- Kinyíló csúszka sáv (balra nyílik ki az ikon mellől) -->
            <div class="w-0 overflow-hidden opacity-0 group-hover:w-20 sm:group-hover:w-24 group-hover:opacity-100 group-hover:mr-2.5 group-hover:pl-1.5 transition-all duration-300 ease-out flex items-center">
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.85" oninput="setVolume(this.value)" class="w-20 sm:w-24">
            </div>
            <!-- Hangikon gomb -->
            <button id="mute-btn" onclick="toggleMute()" class="text-white/80 hover:text-white transition-colors w-5 h-5 flex items-center justify-center shrink-0" title="Mute / Unmute">
                <i id="volume-icon" class="fas fa-volume-high text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Main Center Container -->
    <main id="main-content" class="relative z-10 w-full h-full flex flex-col items-center justify-center px-4 transition-all duration-1000 opacity-0 scale-95">
        
        <!-- Compact Profile Card -->
        <div id="profile-card" class="profile-card w-full max-w-[325px] sm:max-w-[360px] rounded-2xl sm:rounded-3xl p-5 sm:p-6 flex flex-col items-center text-center relative">
            
            <!-- Avatar -->
            <div class="avatar-wrapper mb-3">
                <div class="avatar-ring"></div>
                <img id="display-avatar" src="assets/pfp.webp" alt="Avatar" class="w-20 h-20 sm:w-[88px] sm:h-[88px] rounded-full object-cover border-2 border-black/80 shadow-xl">
                <!-- Online Status Indicator -->
                <span id="status-dot" class="absolute bottom-0.5 right-0.5 w-3.5 h-3.5 rounded-full bg-emerald-400 border-[2.5px] border-[#0d0d0d] shadow-[0_0_8px_#34d399]" title="Online"></span>
            </div>

           <!-- Username with Typewriter Effect (tökéletesen középre igazítva) -->
            <div class="w-full flex flex-col items-center justify-center mb-1">
                <div class="flex items-center justify-center min-h-[32px] w-full">
                    <h1 class="relative inline-flex items-center justify-center text-xl sm:text-2xl font-bold tracking-tight username-glow">
                        <span id="display-username"></span>
                        <span class="cursor-blink text-white/70 font-normal absolute -right-2.5">|</span>
                    </h1>
                </div>
            </div>

            <!-- Location -->
            <div id="location-wrapper" class="flex items-center justify-center gap-1 text-[11px] text-white/50 mb-2.5 font-mono-custom">
                <i class="fas fa-location-dot text-[10px]"></i>
                <span id="display-location">Hungary</span>
            </div>

            <!-- Static Bio Text -->
            <p id="display-bio" class="text-xs sm:text-[13px] text-white/85 font-normal leading-relaxed max-w-[290px] mb-3.5">
                Your only limits are in your mind. A winner is just a loser who tried once more.
            </p>

            <!-- Discord Presence / Activity Card -->
            <div id="presence-card" class="w-full bg-white/[0.03] border border-white/[0.07] rounded-xl p-2.5 mb-3.5 flex items-center gap-2.5 text-left">
                <div class="relative shrink-0">
                    <img id="presence-avatar" src="assets/pfp.webp" class="w-9 h-9 rounded-lg object-cover" alt="Discord">
                    <span id="discord-status-dot" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#121212]"></span>
                </div>
                <div class="overflow-hidden flex-1">
                    <div class="flex items-center gap-1.5">
                        <span id="display-discord-tag" class="text-[11px] font-semibold text-white truncate">Kryxi_999</span>
                    </div>
                    <p id="display-activity" class="text-[11px] text-white/55 truncate mt-0.5">Loading Discord status...</p>
                </div>
                <button onclick="copyDiscord()" class="shrink-0 text-[11px] px-2 py-1 rounded-lg bg-white/5 hover:bg-white/15 text-white/75 hover:text-white border border-white/10 transition-all" title="Copy Discord Username">
                    <i class="far fa-copy"></i>
                </button>
            </div>

            <!-- Social Links Grid -->
            <div id="social-links-container" class="flex flex-wrap items-center justify-center gap-2.5 w-full mb-3.5"></div>

            <!-- Divider -->
            <div class="w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent mb-3"></div>

            <!-- Bottom Bar: Audio Track Info (with Album Cover) & Profile Views -->
            <div class="w-full flex items-center justify-between text-[11px] text-white/55 px-0.5">
                <!-- Now Playing + Album Cover -->
                <div class="flex items-center gap-2 overflow-hidden max-w-[70%]">
                    <img id="display-album-art" src="assets/albummm.png" alt="Album Cover" class="w-7 h-7 rounded-md object-cover border border-white/15 shrink-0 shadow-md">
                    <button onclick="togglePlayPause()" class="w-5 h-5 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white shrink-0 transition-colors">
                        <i id="play-pause-icon" class="fas fa-play text-[9px]"></i>
                    </button>
                    <div class="truncate font-mono-custom text-[10px] text-white/80">
                        <span id="display-song-title">Drowning - Amotti</span>
                    </div>
                </div>

                <!-- Profile Views Counter -->
                <div class="flex items-center gap-1 font-mono-custom text-[10px] bg-white/[0.04] px-2 py-0.5 rounded-full border border-white/[0.06]" title="Profile Views">
                    <i class="far fa-eye text-white/70"></i>
                    <span id="view-counter">0</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const DISCORD_USER_ID = "716152825775915059";

        const config = {
            username: "Kryxiツ",
            bio: "A winner is just a loser who tried once more. Your limits only exist in your mind.",
            location: "Hungary",
            discordTag: "Kryxi_999",
            avatarUrl: "assets/pfp.webp",
            bgUrl: "assets/background.mp4",
            audioUrl: "assets/songg.mp3",
            albumArtUrl: "assets/albummm.png",
            songTitle: "Drowning - Amotti",
            accentColor: "#ffffff",
            cardOpacity: 0.45,
            showPresence: true,
            showParticles: false,
            enableTilt: true,
            socials: [
                { platform: "tiktok", url: "https://www.tiktok.com/@kryxi_999" },
                { platform: "instagram", url: "https://www.instagram.com/_rb_theone" },
                { platform: "twitch", url: "https://www.twitch.tv/kryxi_999" },
                { platform: "steam", url: "https://steamcommunity.com/profiles/76561199235795952/" },
                { platform: "twitter", url: "https://x.com/kryxi_999" }
            ]
        };

        const SOCIAL_ICONS = {
            discord: "fab fa-discord",
            youtube: "fab fa-youtube",
            github: "fab fa-github",
            twitter: "fab fa-x-twitter",
            instagram: "fab fa-instagram",
            tiktok: "fab fa-tiktok",
            spotify: "fab fa-spotify",
            twitch: "fab fa-twitch",
            steam: "fab fa-steam",
            telegram: "fab fa-telegram",
            website: "fas fa-globe"
        };

        let typewriterTimeout = null;
        let isEntered = false;

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            applyConfigToDOM();
            initViewsCounter();
            initParticles();
            initCardTilt();
            updateDiscordStatus();
            setInterval(updateDiscordStatus, 15000);

            const video = document.getElementById('bg-video');
            if (video) {
                video.muted = true;
                video.play().catch(() => {});
            }
        }

        function applyConfigToDOM() {
            document.title = config.username;
            document.getElementById('display-location').textContent = config.location;
            document.getElementById('display-bio').textContent = config.bio;
            document.getElementById('display-discord-tag').textContent = config.discordTag;
            document.getElementById('display-song-title').textContent = config.songTitle;

            document.getElementById('display-avatar').src = config.avatarUrl;
            document.getElementById('presence-avatar').src = config.avatarUrl;
            document.getElementById('display-album-art').src = config.albumArtUrl;

            document.documentElement.style.setProperty('--accent-color', config.accentColor);
            document.documentElement.style.setProperty('--card-bg', `rgba(14, 14, 16, ${config.cardOpacity})`);

            // Kompakt social link gombok (w-9 h-9)
            const container = document.getElementById('social-links-container');
            container.innerHTML = '';
            config.socials.forEach(item => {
                if (!item.url) return;
                const iconClass = SOCIAL_ICONS[item.platform] || 'fas fa-link';
                const a = document.createElement('a');
                a.href = item.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "social-btn w-9 h-9 rounded-xl flex items-center justify-center text-base";
                a.title = item.platform.charAt(0).toUpperCase() + item.platform.slice(1);
                a.innerHTML = `<i class="${iconClass}"></i>`;
                container.appendChild(a);
            });

            startUsernameTypewriter(config.username);
        }

        // ==========================================
        // TYPEWRITER EFFECT A NÉVEN
        // ==========================================
        function startUsernameTypewriter(text) {
            if (typewriterTimeout) clearTimeout(typewriterTimeout);
            const el = document.getElementById('display-username');
            el.textContent = '';
            let i = 0;
            let isDeleting = false;

            function tick() {
                if (!isDeleting) {
                    el.textContent = text.substring(0, i + 1);
                    i++;
                    if (i < text.length) {
                        typewriterTimeout = setTimeout(tick, 180);
                    } else {
                        typewriterTimeout = setTimeout(() => {
                            isDeleting = true;
                            tick();
                        }, 2400);
                    }
                } else {
                    el.textContent = text.substring(0, i - 1);
                    i--;
                    if (i > 0) {
                        typewriterTimeout = setTimeout(tick, 110);
                    } else {
                        isDeleting = false;
                        typewriterTimeout = setTimeout(tick, 500);
                    }
                }
            }
            tick();
        }

// ==========================================
        // VALÓDI ÉLŐ GLOBÁLIS SZÁMLÁLÓ (FIREBASE)
        // ==========================================
        const FIREBASE_DB_URL = "https://kryxis-f67f2-default-rtdb.europe-west1.firebasedatabase.app";

        async function initViewsCounter() {
            const counterEl = document.getElementById('view-counter');
            const url = `${FIREBASE_DB_URL}/views.json`;

            try {
                // 1. Lekérjük az aktuális közös számot (ha még nincs, 0-ról indul)
                const getRes = await fetch(url, { cache: 'no-store' });
                const currentViews = await getRes.json();
                const nextViews = (typeof currentViews === 'number' ? currentViews : 0) + 1;

                // 2. Elmentjük a +1-gyel növelt értéket a közös adatbázisba
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nextViews)
                });
                const savedViews = await putRes.json();

                // 3. Kiírjuk a kártyára
                counterEl.textContent = savedViews.toLocaleString();
            } catch (err) {
                console.error("Számláló hiba:", err);
                counterEl.textContent = "0";
            }
        }
        // ==========================================
        // LIVE DISCORD PRESENCE (LANYARD API)
        // ==========================================
        async function updateDiscordStatus() {
            if (!DISCORD_USER_ID) return;
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
                const json = await res.json();
                if (!json.success) return;

                const data = json.data;
                const user = data.discord_user;

                if (user.avatar) {
                    const avatarExt = user.avatar.startsWith("a_") ? "gif" : "png";
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${avatarExt}?size=256`;
                    const discordAvatarEl = document.getElementById('presence-avatar');
                    if (discordAvatarEl) discordAvatarEl.src = avatarUrl;
                }

                const discordNameEl = document.getElementById('display-discord-tag');
                if (discordNameEl) {
                    discordNameEl.textContent = user.global_name || user.username;
                    config.discordTag = user.username;
                }

                const statusColors = {
                    online: "bg-emerald-400",
                    idle: "bg-amber-400",
                    dnd: "bg-rose-500",
                    offline: "bg-zinc-500"
                };
                const dotColor = statusColors[data.discord_status] || "bg-zinc-500";
                const dcDot = document.getElementById('discord-status-dot');
                const mainDot = document.getElementById('status-dot');
                if (dcDot) dcDot.className = `absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full ${dotColor} border-2 border-[#121212]`;
                if (mainDot) mainDot.className = `absolute bottom-0.5 right-0.5 w-3.5 h-3.5 rounded-full ${dotColor} border-[2.5px] border-[#0d0d0d]`;

                const activityEl = document.getElementById('display-activity');
                if (activityEl) {
                    if (data.listening_to_spotify && data.spotify) {
                        activityEl.textContent = `Listening to ${data.spotify.song} - ${data.spotify.artist}`;
                    } else if (data.activities && data.activities.length > 0) {
                        const game = data.activities.find(a => a.type === 0);
                        const custom = data.activities.find(a => a.type === 4);
                        if (game) {
                            activityEl.textContent = `Playing ${game.name}${game.details ? ' - ' + game.details : ''}`;
                        } else if (custom && custom.state) {
                            activityEl.textContent = custom.state;
                        } else {
                            activityEl.textContent = data.discord_status === "dnd" ? "Do Not Disturb" : data.discord_status.charAt(0).toUpperCase() + data.discord_status.slice(1);
                        }
                    } else {
                        const labels = { online: "Online", idle: "Idle", dnd: "Do Not Disturb", offline: "Offline" };
                        activityEl.textContent = labels[data.discord_status] || "Offline";
                    }
                }
            } catch (err) {
                console.error("Discord Lanyard hiba:", err);
            }
        }

        // ==========================================
        // CLICK TO ENTER & MEDIA PLAYBACK
        // ==========================================
        function enterSite() {
            if (isEntered) return;
            isEntered = true;

            const overlay = document.getElementById('enter-screen');
            overlay.classList.add('hidden-overlay');

            const main = document.getElementById('main-content');
            main.classList.remove('opacity-0', 'scale-95');
            main.classList.add('opacity-100', 'scale-100');

            document.getElementById('top-controls').classList.remove('opacity-0');

            const video = document.getElementById('bg-video');
            if (video) {
                video.muted = true;
                video.play().catch(() => {});
            }

            const audio = document.getElementById('bg-audio');
            if (audio) {
                audio.volume = parseFloat(document.getElementById('volume-slider').value);
                audio.play().then(() => {
                    document.getElementById('play-pause-icon').className = 'fas fa-pause text-[9px]';
                }).catch(() => {
                    document.getElementById('play-pause-icon').className = 'fas fa-play text-[9px]';
                });
            }
        }

        function togglePlayPause() {
            const audio = document.getElementById('bg-audio');
            const icon = document.getElementById('play-pause-icon');
            if (audio.paused) {
                audio.play();
                icon.className = 'fas fa-pause text-[9px]';
            } else {
                audio.pause();
                icon.className = 'fas fa-play text-[9px]';
            }
        }

        function setVolume(val) {
            const audio = document.getElementById('bg-audio');
            audio.volume = val;
            audio.muted = (val == 0);
            updateVolumeIcon(val);
        }

        function toggleMute() {
            const audio = document.getElementById('bg-audio');
            const slider = document.getElementById('volume-slider');
            audio.muted = !audio.muted;
            if (audio.muted) {
                updateVolumeIcon(0);
            } else {
                if (slider.value == 0) slider.value = 0.5;
                audio.volume = slider.value;
                updateVolumeIcon(slider.value);
            }
        }

        function updateVolumeIcon(val) {
            const icon = document.getElementById('volume-icon');
            if (val == 0) icon.className = 'fas fa-volume-xmark text-xs text-red-400';
            else if (val < 0.5) icon.className = 'fas fa-volume-low text-xs';
            else icon.className = 'fas fa-volume-high text-xs';
        }

        // ==========================================
        // 3D TILT EFFECT ON CARD
        // ==========================================
        function initCardTilt() {
            const card = document.getElementById('profile-card');
            document.addEventListener('mousemove', (e) => {
                if (!config.enableTilt || window.innerWidth < 640) {
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
                    return;
                }
                const rect = card.getBoundingClientRect();
                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;
                const deltaX = (e.clientX - cardCenterX) / (window.innerWidth / 2);
                const deltaY = (e.clientY - cardCenterY) / (window.innerHeight / 2);

                const rotateY = deltaX * 7;
                const rotateX = -deltaY * 7;
                card.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
            });
        }

        // ==========================================
        // PARTICLES & UTILITIES
        // ==========================================
        function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = Array.from({ length: 55 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2 + 0.6,
                speedY: Math.random() * 0.6 + 0.2,
                speedX: (Math.random() - 0.5) * 0.3,
                opacity: Math.random() * 0.5 + 0.15
            }));

            function animate() {
                ctx.clearRect(0, 0, width, height);
                if (config.showParticles) {
                    particles.forEach(p => {
                        p.y += p.speedY;
                        p.x += p.speedX;
                        if (p.y > height) { p.y = -5; p.x = Math.random() * width; }
                        if (p.x > width) p.x = 0;
                        if (p.x < 0) p.x = width;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                        ctx.fill();
                    });
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        function copyDiscord() {
            navigator.clipboard.writeText(config.discordTag).then(() => {
                showToast(`Copied "${config.discordTag}" to clipboard!`);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2600);
        }

        init();
    </script>
</body>
